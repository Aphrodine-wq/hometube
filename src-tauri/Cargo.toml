[package]
name = "hometube"
version = "0.1.0"
description = "A cinematic local video library with native YouTube downloads"
authors = ["HomeTube contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "hometube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
fs2 = "0.4"
notify = "8"
oxicast = "0.0.3"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
trash = "5.2.6"
walkdir = "2"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
